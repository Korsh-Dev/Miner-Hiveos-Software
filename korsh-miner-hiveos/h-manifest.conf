# ============================================================
# HiveOS Custom Miner Manifest: korsh-miner-hiveos
# ============================================================

CUSTOM_NAME="korsh-miner-hiveos"
CUSTOM_VERSION="1.0.2"
CUSTOM_BUILD="1"
CUSTOM_CONFIG_FILENAME="/hive/miners/custom/korsh-miner-hiveos/korsh-miner-hiveos.conf"
CUSTOM_LOG_BASENAME="/var/log/miner/custom/korsh-miner-hiveos/korsh-miner-hiveos"

# Callbacks for HiveOS /hive/bin/miner-run
miner_ver() {
    echo "${CUSTOM_VERSION:-1.0.2}"
}

miner_config_gen() {
    local dir="/hive/miners/custom/${CUSTOM_NAME:-korsh-miner-hiveos}"
    if [[ -x "$dir/h-config.sh" ]]; then
        "$dir/h-config.sh"
    elif [[ -x "./h-config.sh" ]]; then
        ./h-config.sh
    fi
}
